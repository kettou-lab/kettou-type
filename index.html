<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>あなたの血糖タイプ診断</title>
<meta name="description" content="血糖値は「糖が多いか少ないか」だけでなく、体がエネルギーをどう作って、どう使っているかを見る必要があります。8つの質問で、あなたの身体のタイプと、今日からできる具体的な一歩が分かります。">
<style>
:root{--c:#dc7c37;--c2:#a55d29;--t:#fdf3eb;--s:#f9e0ce;--ink:#1f2328;--sub:#5b6168;--line:#e3e5e8;--bg:#f6f7f8}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(180deg,var(--t),var(--bg) 320px);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;line-height:1.8;-webkit-text-size-adjust:100%;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 36px}
.card{background:#fff;border-radius:18px;box-shadow:0 2px 16px rgba(0,0,0,.07);padding:28px 20px 30px}
h1,h2,h3{line-height:1.45;margin:0;outline:none}
.kicker{display:inline-block;background:var(--t);color:var(--c2);font-weight:700;font-size:13px;border-radius:999px;padding:3px 12px;margin:0 0 10px}
.title{font-size:25px;font-weight:800;letter-spacing:.01em}
.lead{margin:14px 0 0;font-size:16px;color:var(--ink)}
.pts{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:8px}
.pts li{background:var(--t);border-radius:10px;padding:9px 12px 9px 36px;position:relative;font-size:15px}
.pts li:before{content:"";position:absolute;left:14px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--c)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px 18px;font-size:17px;font-weight:800;text-align:center;text-decoration:none;cursor:pointer;margin:22px 0 0;font-family:inherit;line-height:1.5}
.btn.main{background:var(--c);color:#fff;box-shadow:0 4px 0 var(--c2)}
.btn.main:active{transform:translateY(2px);box-shadow:0 2px 0 var(--c2)}
.btn.sub{background:#fff;color:var(--c2);border:2px solid var(--s);margin-top:12px;font-size:15px;padding:12px}
.note{margin:18px 0 0;font-size:13px;color:var(--sub)}
.prog{display:flex;align-items:center;gap:10px;margin:0 0 18px}
.prog-t{font-size:13px;font-weight:700;color:var(--c2);white-space:nowrap}
.bar{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.fill{height:100%;background:var(--c);border-radius:999px}
.qt{font-size:20px;font-weight:800}
.opts{display:grid;gap:10px;margin:18px 0 0}
.opt{width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px 16px;font-size:16px;font-family:inherit;color:var(--ink);cursor:pointer;line-height:1.6}
.opt:hover,.opt:focus-visible{border-color:var(--c);background:var(--t);outline:none}
.back{background:none;border:0;color:var(--sub);font-size:14px;margin:16px 0 0;padding:6px 0;cursor:pointer;font-family:inherit}
.checks{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.checks label{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:16px}
.checks input{width:22px;height:22px;flex:0 0 22px;margin:3px 0 0;accent-color:var(--c)}
.checks label.on{border-color:var(--c);background:var(--t)}
.count{margin:14px 0 0;font-weight:700;color:var(--c2);text-align:right}
.form{display:grid;gap:16px;margin:18px 0 0}
.field label{display:block;font-weight:700;font-size:15px;margin:0 0 6px}
.field .hint{display:block;font-weight:400;font-size:13px;color:var(--sub)}
.inrow{display:flex;align-items:center;gap:8px}
.inrow input,.inrow select{flex:1;min-width:0;font-size:17px;padding:12px;border:2px solid var(--line);border-radius:10px;font-family:inherit;background:#fff;color:var(--ink)}
.inrow input:focus,.inrow select:focus{border-color:var(--c);outline:none}
.unit{color:var(--sub);font-size:15px;white-space:nowrap}
.date{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.err{color:#b42318;font-weight:700;font-size:14px;margin:12px 0 0;min-height:1em}
.res-k{margin:0 0 4px;font-size:14px;font-weight:700;color:var(--c2)}
.res-name{font-size:26px;font-weight:800;color:var(--ink)}
.res-catch{margin:12px 0 0;font-size:17px;font-weight:700;background:var(--t);border-left:5px solid var(--c);padding:10px 14px;border-radius:0 10px 10px 0}
.res-body{margin:14px 0 0;font-size:16px}
.res-h{margin:22px 0 8px;font-size:17px;font-weight:800}
.res-pts{margin:0;padding:0 0 0 1.3em}
.res-pts li{margin:4px 0}
.nums{display:grid;gap:10px;margin:14px 0 0}
.num{background:var(--t);border-radius:12px;padding:12px 14px}
.num-l{display:block;font-size:14px;color:var(--sub);font-weight:700}
.num-v{font-size:28px;font-weight:800;color:var(--c2)}
.num-u{font-size:15px;font-weight:700;margin-left:4px}
.score{margin:10px 0 0;font-size:15px;color:var(--sub);font-weight:700}
.cta{margin:26px 0 0;border:2px solid var(--c);border-radius:16px;padding:18px 16px;background:linear-gradient(180deg,#fff,var(--t))}
.cta-lead{margin:0;font-weight:700;font-size:16px}
.cta .btn{margin-top:14px}
.kw{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 0;background:#fff;border:1px dashed var(--c);border-radius:10px;padding:10px 12px}
.kw-l{font-size:13px;color:var(--sub);font-weight:700}
.kw-v{font-size:19px;color:var(--c2)}
.kw-cp{margin-left:auto;background:var(--c);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer;font-family:inherit}
.pic{display:block;width:100%;max-width:340px;height:auto;margin:0 auto 18px}
.res .pic{margin:6px auto 14px}
.foot{font-size:12px;color:var(--sub);text-align:center;margin:18px 0 0;line-height:1.7}
@media (min-width:560px){.card{padding:36px 34px 38px}.title{font-size:29px}}

/* Readable introduction (orange) */
.start{--o:#E8833A;--od:#C4621C;--ol:#FFF3E8;--om:#FFE2C7;color:#4a3b31}
.start p{margin:0 0 22px}
.intro-hero{text-align:center;padding:16px 0 30px;position:relative}
.intro-hero:before{content:"";display:block;width:74px;height:74px;background:radial-gradient(circle at 35% 35%,#FFC48F,var(--o));border-radius:50%;margin:0 auto 20px;box-shadow:38px -8px 0 -18px #FFD9B3,-34px 16px 0 -22px #F7B27A}
.intro-eyebrow{font-size:12px;letter-spacing:.14em;color:var(--od);font-weight:700}
.start .title{font-size:clamp(26px,6.4vw,36px);line-height:1.65;letter-spacing:.04em}
.intro-section{padding:30px 0;border-top:2px dotted #F6D3B4}
.intro-section h2{font-size:22px;line-height:1.7;margin-bottom:22px}
.start p,.intro-section li{font-size:16px;line-height:2}
.worry-list{list-style:none;padding:0;margin:0 0 28px;display:grid;gap:12px}
.worry-list li{padding:16px 16px 16px 50px;background:var(--ol);border:1.5px solid #FBDCC0;border-radius:16px;position:relative}
.worry-list li:before{content:"✓";position:absolute;left:15px;top:18px;border-radius:50%;background:var(--o);color:#fff;width:24px;height:24px;line-height:24px;text-align:center;font-size:13px;font-weight:800}
.intro-quote{background:linear-gradient(135deg,#FFF0E0,#FFE2C7);border-radius:20px;padding:24px 20px;text-align:center;font-weight:700;color:#8A4514}
.start .intro-quote p:last-child{margin:0}
.cycle{list-style:none;margin:24px 0 30px;padding:0;counter-reset:steps}
.cycle li{counter-increment:steps;position:relative;display:flex;align-items:center;gap:14px;background:var(--ol);border-radius:16px;padding:16px;margin-bottom:22px;font-weight:600}
.cycle li:before{content:counter(steps,decimal-leading-zero);display:grid;place-items:center;flex:0 0 38px;height:38px;border-radius:50%;background:var(--o);color:#fff;font-size:13px;font-weight:800}
.cycle li:not(:last-child):after{content:"↓";position:absolute;bottom:-25px;left:32px;color:var(--o);font-weight:800}
.cycle li:last-child{background:#FFE2C7}
.intro-highlight{font-size:21px!important;line-height:1.9!important;font-weight:800}
.start mark{background:linear-gradient(transparent 60%,#FFD2A6 60%);color:inherit;padding:0 2px}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px 0}
.type-item{position:relative;padding:12px 12px 16px;border-radius:20px;font-size:15px;line-height:1.8;border:2px solid;box-shadow:0 3px 0 rgba(196,98,28,.12)}
.type-item:nth-child(1){background:#FFF1E2;border-color:#F7C08E}
.type-item:nth-child(2){background:#FFF6DC;border-color:#F4CF77}
.type-item:nth-child(3){background:#FFEDE6;border-color:#F4B7A1}
.type-item:nth-child(4){background:#F3F7E8;border-color:#C9DBA0}
.type-item img{display:block;width:100%;height:auto;border-radius:14px;background:#fff;margin:0 0 10px}
.type-dot{position:absolute;top:6px;left:6px;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--o);border:2px solid #fff;color:#fff;font-weight:800;font-size:12px}
.type-item strong{color:#8A4514}
.intro-invite{text-align:center;background:linear-gradient(180deg,#FFF3E8,#FFE6CF);border:2px solid #F7C08E;border-radius:24px;padding:32px 20px 28px;margin-top:20px;position:relative;overflow:hidden}
.intro-invite:before,.intro-invite:after{content:"";position:absolute;border-radius:50%;background:#FFD9B3;opacity:.55;z-index:0}
.intro-invite:before{width:120px;height:120px;top:-50px;right:-40px}
.intro-invite:after{width:80px;height:80px;bottom:-30px;left:-30px}
.intro-invite>*{position:relative;z-index:1}
.intro-invite .kicker{background:var(--o);color:#fff;padding:5px 16px;font-size:14px}
.intro-invite h2{font-size:clamp(19px,5.4vw,24px);line-height:1.7;margin:6px 0 18px}
.invite-lead{font-size:16px!important;line-height:1.9!important;margin:0 0 20px!important}
.intro-perks{list-style:none;padding:0;text-align:left;margin:0 0 24px;display:grid;gap:10px}
.intro-perks li{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:14px 16px;font-size:16px!important;line-height:1.6!important;font-weight:700;color:#4a3b31;box-shadow:0 2px 0 rgba(196,98,28,.15)}
.perk-ic{flex:0 0 44px;width:44px;height:44px;border-radius:50%;background:var(--o);display:grid;place-items:center}
.perk-ic svg{width:24px;height:24px}
.perk-sub{display:block;font-size:13px;font-weight:500;color:#8a6a55}
.invite-voice{background:#fff;border:2px dashed #F7B27A;border-radius:18px;padding:16px 14px;margin:0 0 6px!important;font-size:16px!important;line-height:1.9!important}
.invite-voice b{display:block;color:#8A4514;font-size:17px;margin-bottom:4px}
.start .btn.main{background:var(--c);box-shadow:0 4px 0 var(--c2);border-radius:999px}
.start .note{font-size:12px;line-height:1.9;margin:22px 0 0;color:#77716b}
@media(max-width:380px){.type-grid{grid-template-columns:1fr}.intro-invite{padding:26px 14px 22px}.intro-perks li{padding:12px;gap:12px;font-size:15px!important}.perk-ic{flex-basis:38px;width:38px;height:38px}.intro-section h2{font-size:20px}}
</style>
</head>

function begin(){ans=[];
 if(D.type==='diagnosis'||(D.type==='score'&&D.style!=='check'))return q(0);

function q(i){
 var Q=D.questions,s=el('section','scr q');
 var pr=el('div','prog');pr.appendChild(el('span','prog-t',(i+1)+' / '+Q.length));var bar=el('div','bar'),f=el('div','fill');f.style.width=(i/Q.length*100)+'%';bar.appendChild(f);pr.appendChild(bar);s.appendChild(pr);
 s.appendChild(el('h2','qt',Q[i].q));
 var box=el('div','opts');
 Q[i].options.forEach(function(o,k){var b=el('button','opt',o.label);b.type='button';b.onclick=function(){ans[i]=k;if(i+1<Q.length)q(i+1);else finish();};box.appendChild(b);});
 s.appendChild(box);
 if(i>0){var bk=el('button','back','← ひとつ前に戻る');bk.type='button';bk.onclick=function(){q(i-1);};s.appendChild(bk);}
 show(s);
}
function finish(){
 if(D.type==='diagnosis'){
  var tot={};D.results.forEach(function(r){tot[r.id]=0;});
  D.questions.forEach(function(qq,i){var add=qq.options[ans[i]].add||{};Object.keys(add).forEach(function(k){tot[k]+=add[k];});});
  var best=D.results[0];D.results.forEach(function(r){if(tot[r.id]>tot[best.id])best=r;});
  return result(best);
 }
 var sum=0;D.questions.forEach(function(qq,i){sum+=qq.options[ans[i]].score||0;});
 return result(level(sum),function(s){scoreLine(s,sum);});
}
function level(v){for(var i=0;i<D.levels.length;i++){var L=D.levels[i];if((L.min==null||v>=L.min)&&(L.max==null||v<=L.max))return L;}return D.levels[D.levels.length-1];}

function calc(){

 var fm=el('div','form'),err=el('p','err');
 D.inputs.forEach(function(it){var f=el('div','field'),lb=el('label',null,it.label);var id='in-'+it.id;lb.htmlFor=id;if(it.hint)lb.appendChild(el('span','hint',it.hint));f.appendChild(lb);var row=el('div','inrow'),inp;
  if(it.kind==='select'){inp=el('select');it.options.forEach(function(o,k){var op=el('option',null,o.label);op.value=k;inp.appendChild(op);});if(it.default!=null)inp.value=String(it.default);}
  else{inp=el('input');inp.type='number';inp.inputMode='decimal';if(it.min!=null)inp.min=it.min;if(it.max!=null)inp.max=it.max;inp.step=it.step||'any';if(it.default!=null)inp.value=it.default;if(it.placeholder)inp.placeholder=it.placeholder;}
  inp.id=id;row.appendChild(inp);if(it.unit)row.appendChild(el('span','unit',it.unit));f.appendChild(row);fm.appendChild(f);});
 s.appendChild(fm);s.appendChild(err);
 var b=el('button','btn main',D.submit_label||'計算する');b.type='button';
 b.onclick=function(){var v={};for(var i=0;i<D.inputs.length;i++){var it=D.inputs[i],e=document.getElementById('in-'+it.id);
   if(it.kind==='select'){v[it.id]=Number(it.options[Number(e.value)].value);continue;}
   if(e.value===''){err.textContent=it.label+'を入れてください';e.focus();return;}
   var x=Number(e.value);if(!isFinite(x)){err.textContent=it.label+'は数字で入れてください';e.focus();return;}
   if((it.min!=null&&x<it.min)||(it.max!=null&&x>it.max)){err.textContent=it.label+'は '+Number(it.min).toLocaleString('ja-JP')+'〜'+Number(it.max).toLocaleString('ja-JP')+(it.unit||'')+' の間で入れてください';e.focus();return;}
   v[it.id]=x;}
  var out=[];for(var j=0;j<D.outputs.length;j++){var o=D.outputs[j];var y=F[o.id](v);v[o.id]=y;out.push([o,y]);}
  if(D.show_order){out.sort(function(a,b){var i=D.show_order.indexOf(a[0].id),k=D.show_order.indexOf(b[0].id);return (i<0?99:i)-(k<0?99:k);});}
  var lv=D.levels&&D.levels.of!=null?D.levels:null;var r=lv?pick(lv.items,v[lv.of]):(D.result||{name:D.result_name||'計算の結果'});
  result(r,function(x){var box=el('div','nums');out.forEach(function(p){if(p[0].hidden)return;var n=el('div','num');n.appendChild(el('span','num-l',p[0].label));var val=isFinite(p[1])?Number(p[1]).toLocaleString('ja-JP',{maximumFractionDigits:p[0].digits==null?1:p[0].digits,minimumFractionDigits:p[0].digits_fixed?p[0].digits:0}):'—';n.appendChild(el('span','num-v',val));if(p[0].unit)n.appendChild(el('span','num-u',p[0].unit));box.appendChild(n);});x.appendChild(box);},true);
 };
 s.appendChild(b);show(s);
}
function pick(items,v){for(var i=0;i<items.length;i++){var L=items[i];if((L.min==null||v>=L.min)&&(L.max==null||v<L.max))return L;}return items[items.length-1];}

 function sel(id,a,b,u,rev){var w=el('div','inrow'),sl=el('select');sl.id=id;var o0=el('option',null,'--');o0.value='';sl.appendChild(o0);var arr=[];for(var i=a;i<=b;i++)arr.push(i);if(rev)arr.reverse();arr.forEach(function(i){var o=el('option',null,String(i));o.value=i;sl.appendChild(o);});w.appendChild(sl);w.appendChild(el('span','unit',u));dt.appendChild(w);return sl;}

function fkey(y,m,d){
 if(D.method==='month')return String(m);
 if(D.method==='zodiac'){var Z=[[1, 20, "みずがめ座"], [2, 19, "うお座"], [3, 21, "おひつじ座"], [4, 20, "おうし座"], [5, 21, "ふたご座"], [6, 22, "かに座"], [7, 23, "しし座"], [8, 23, "おとめ座"], [9, 23, "てんびん座"], [10, 24, "さそり座"], [11, 23, "いて座"], [12, 22, "やぎ座"]],n='やぎ座';Z.forEach(function(z){if(m>z[0]||(m===z[0]&&d>=z[1]))n=z[2];});return n;}
 var keep=!!(D.results['11']||D.results['22']||D.results['33']);var s=String(y)+(m<10?'0':'')+m+(d<10?'0':'')+d;var t=0;s.split('').forEach(function(c){t+=+c;});
 while(t>9&&!(keep&&(t===11||t===22||t===33))){var u=0;String(t).split('').forEach(function(c){u+=+c;});t=u;}return String(t);
}
function result(r,extra,numsFirst,who){
 var s=el('section','scr res');
 pic(s,r.image,r.name);
 s.appendChild(el('p','res-k',who||D.result_label||'あなたの結果'));
 s.appendChild(el('h2','res-name',r.name));
 if(extra)extra(s);
 if(r.catch)s.appendChild(el('p','res-catch',r.catch));
 if(r.body)String(r.body).split('\n').forEach(function(p){if(p.trim())s.appendChild(el('p','res-body',p));});
 if(r.points&&r.points.length){s.appendChild(el('h3','res-h',D.points_label||'次の一歩'));var ul=el('ul','res-pts');r.points.forEach(function(t){ul.appendChild(el('li',null,t));});s.appendChild(ul);}
 var c=D.cta;if(c&&(c.url||c.keyword||r.keyword)){var bx=el('div','cta');if(c.lead)bx.appendChild(el('p','cta-lead',fill(c.lead,r)));var kw=r.keyword||c.keyword;
  if(kw){var k=el('div','kw');k.appendChild(el('span','kw-l',c.keyword_label||'合言葉'));k.appendChild(el('strong','kw-v',kw));var cp=el('button','kw-cp','コピー');cp.type='button';cp.onclick=function(){copy(kw,cp);};k.appendChild(cp);bx.appendChild(k);}
  if(c.url){var a=el('a','btn main',fill(c.button||'くわしく見る',r));a.href=c.url;a.target='_blank';a.rel='noopener';bx.appendChild(a);}
  s.appendChild(bx);}
 if(D.share_text){var t=fill(D.share_text,r);var sb=el('button','btn sub','結果の文をコピー');sb.type='button';sb.onclick=function(){copy(t,sb);};s.appendChild(sb);}
 var ag=el('button','btn sub',D.retry_label||'もう一度やる');ag.type='button';ag.onclick=function(){if(location.hash){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}}start();};s.appendChild(ag);
 if(D.note)s.appendChild(el('p','note',D.note));
 show(s);
}
function direct(){var h=decodeURIComponent((location.hash||'').slice(1));if(!h||D.type!=='diagnosis')return null;for(var i=0;i<D.results.length;i++){if(D.results[i].id===h)return D.results[i];}return null;}
var R0=direct();if(R0)result(R0);else start();
})();
</script>
